name: Build mod

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:   # ручной запуск кнопкой "Run workflow"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Gradle ставится самим workflow, gradlew в репозитории не нужен
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build
        run: gradle build --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: celestial-jar
          path: build/libs/*.jar
          if-no-files-found: error
